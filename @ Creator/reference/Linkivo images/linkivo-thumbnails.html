const D=[d1,t2,t3,t4,t5,t6,t7,t8];
const MAIN=D.length;
let cur=0,timer=null;
const $ = id => document.getElementById(id);

const build = i => D[i === undefined ? cur : i]();

function show() {
  $('stage').innerHTML = build();
  $('cnt').textContent = `${cur + 1} / ${MAIN}`;
  $('prog').style.width = ((cur + 1) / MAIN * 100) + '%';
  document.querySelectorAll('.th').forEach(b => b.classList.toggle('on', +b.dataset.i == cur));
}

function render() {
  $('strip').innerHTML = D.map((f, i) => `<button class="th" data-i="${i}">${f()}</button>`).join('');
  document.querySelectorAll('.th').forEach(b => b.onclick = () => go(+b.dataset.i));
  show();
}

function go(i) {
  cur = (i + D.length) % D.length;
  const st = $('stage');
  st.classList.add('out');
  setTimeout(() => { show(); st.classList.remove('out'); }, 160);
}

function play(on) {
  clearInterval(timer);
  timer = on ? setInterval(() => go(cur + 1), 4000) : null;
  $('play').textContent = on ? 'Pause' : 'Play';
}

$('prev').onclick = () => go(cur - 1);
$('next').onclick = () => go(cur + 1);
$('play').onclick = () => play(!timer);
$('fs').onclick = () => {
  const e = $('stage');
  document.fullscreenElement ? document.exitFullscreen() : e.requestFullscreen && e.requestFullscreen();
};

$('stage').onclick = () => { if (document.fullscreenElement) go(cur + 1); };

document.addEventListener('keydown', e => {
  if (e.key == 'ArrowRight') go(cur + 1);
  else if (e.key == 'ArrowLeft') go(cur - 1);
  else if (e.key == ' ') { e.preventDefault(); play(!timer); }
  else if (e.key == 'f') $('fs').onclick();
});

async function embedFont(){try{const css=await (await fetch(document.getElementById('fontcss').href)).text();let out=css;
for(const u of [...new Set([...css.matchAll(/url\((https:[^)]+)\)/g)].map(m=>m[1]))]){const b=await (await fetch(u)).blob();
const d=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});out=out.split(u).join(d)}fontCSS=out;return true}catch(e){return false}}

function svgString(i){let s=build(i);if(fontCSS)s=s.replace('<defs>',`<defs><style>${fontCSS}</style>`);return '<?xml version="1.0" encoding="UTF-8"?>\n'+s}
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

async function exp(f,i=cur){const s=svgString(i);
if(f==='svg')return save(new Blob([s],{type:'image/svg+xml'}),`linkivo-thumbnail-${i+1}.svg`);
const k=+document.getElementById('scale').value,img=new Image();
img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);await img.decode();
const c=document.createElement('canvas');c.width=W*k;c.height=H*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
const mime={png:'image/png',webp:'image/webp',jpg:'image/jpeg'}[f];
c.toBlob(b=>save(b,`linkivo-thumbnail-${i+1}.${f}`),mime,.95)}

document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>exp(b.dataset.f));

document.getElementById('all').onclick = async () => {
  const fmt = document.getElementById('all-fmt').value;
  for (let i = 0; i < D.length; i++) {
    await exp(fmt, i);
    await new Promise(r => setTimeout(r, 350));
  }
};
