  clearInterval(timer);
  timer = on ? setInterval(() => go(cur + 1), 4000) : null;

</style>`);return '<?xml version="1.0" encoding="UTF-8"?>\n'+s}
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

async function exp(f,i=cur){const s=svgString(i);
if(f==='svg')return save(new Blob([s],{type:'image/svg+xml'}),`linkivo-${FN[i]}.svg`);

const mime={png:'image/png',webp:'image/webp',jpg:'image/jpeg'}[f];
c.toBlob(b=>save(b,`linkivo-${FN[i]}.${f}`),mime,.95)}

document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>exp(b.dataset.f));
