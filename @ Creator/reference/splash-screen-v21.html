
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linkivo</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #eef2f8; --grid: #d6dfed; --text: #0c1629; --sub: #566d8a;
      --card-bg: rgba(255,255,255,0.92); --card-b: rgba(182,200,228,0.82);
      --ctrl-bg: rgba(255,255,255,0.9); --ctrl-b: #c6d2e4; --ctrl-c: #546880;
      --grad-1: #3b82f6; --grad-2: #22d3ee;
      --bg-locked: #dbeafe;
    }
    html.dark {
      --bg: #060d1a; --grid: #0c1928; --text: #d4e6f6; --sub: #4d6c8a;
      --card-bg: rgba(7,16,34,0.92); --card-b: rgba(24,48,82,0.72);
      --ctrl-bg: rgba(5,12,26,0.9); --ctrl-b: #122036; --ctrl-c: #4d6c8a;
      --bg-locked: #0f1c33;
    }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: 'Outfit', sans-serif;
      transition: background .4s ease, color .4s ease;
    }

    /* Expanding Circular Background */
    #bg-expand {
      position: fixed; inset: 0; z-index: 0;
      background: var(--bg-locked);
      clip-path: circle(0px at 50% 50%);
      transition: clip-path 1.2s cubic-bezier(0.4, 0, 0.2, 1), background .4s ease;
      pointer-events: none;
    }

    /* Controls */
    #ctrl { position: fixed; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 9999; }
    .cbtn {
      padding: 8px 16px;
      background: var(--ctrl-bg); border: 1.5px solid var(--ctrl-b);
      color: var(--ctrl-c); border-radius: 10px;
      font: 500 13px 'Outfit', sans-serif; cursor: pointer;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      transition: all .2s; user-select: none;
    }
    .cbtn:hover { color: var(--text); transform: translateY(-2px); }

    /* Splash Area */
    #splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 100; overflow: hidden;
    }
    
    /* Grid with Radial Mask */
    .bg-grid {
      position: absolute; inset: 0; z-index: 1;
      background-image:
        linear-gradient(to right, var(--grid) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, var(--grid) 1.5px, transparent 1.5px);
      background-size: 40px 40px;
      opacity: 0.8; 
      mask-image: radial-gradient(circle at center, rgba(0,0,0,0.1) 0%, rgba(0,0,0,1) 80%);
      -webkit-mask-image: radial-gradient(circle at center, rgba(0,0,0,0.1) 0%, rgba(0,0,0,1) 80%);
    }

    .glow-orb {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 800px; height: 800px;
      background: radial-gradient(circle, rgba(59,130,246,.15) 0%, transparent 65%);
      border-radius: 50%; z-index: 2;
      animation: orbPulse 6s ease-in-out infinite;
    }
    html.dark .glow-orb { background: radial-gradient(circle, rgba(34,211,238,.1) 0%, transparent 65%); }
    @keyframes orbPulse {
      0%, 100% { transform: translate(-50%,-50%) scale(1); opacity: 0.8; }
      50% { transform: translate(-50%,-50%) scale(1.1); opacity: 1; }
    }

    /* URL Cards Wrappers & Layers */
    .ucard-wrapper {
      position: absolute; z-index: 15;
      width: 0; height: 0; display: flex; align-items: center; justify-content: center;
    }
    .ucard-pos {
      position: absolute;
      display: flex; align-items: center; justify-content: center;
      will-change: transform;
    }
    .ucard {
      background: var(--card-bg); border: 1px solid var(--card-b);
      border-radius: 10px; padding: 6px 12px 6px 8px; 
      font: 500 12px 'Outfit', sans-serif; color: var(--sub); 
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
      display: flex; align-items: center; gap: 8px;
      white-space: nowrap; opacity: 0; pointer-events: none;
      will-change: transform, opacity, width, padding, border-radius, background, border-color;
      overflow: hidden;
      height: 36px;
      box-sizing: border-box;
    }
    .ufav {
      width: 22px; height: 22px; border-radius: 5px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all .35s cubic-bezier(0.4, 0, 0.2, 1);
      color: white;
    }
    .ufav svg { width: 12px; height: 12px; }
    .utext-wrap { display: flex; overflow: hidden; justify-content: flex-start; align-items: center; }
    .utext {
      display: inline-block; white-space: nowrap;
    }

    /* Drifting Animations */
    @keyframes dA { 0%,100%{transform:translate(0,0)} 30%{transform:translate(8px,-6px)} 65%{transform:translate(-5px,6px)} }
    @keyframes dB { 0%,100%{transform:translate(0,0)} 30%{transform:translate(-6px,8px)} 65%{transform:translate(8px,-5px)} }
    @keyframes dC { 0%,100%{transform:translate(0,0)} 30%{transform:translate(6px,10px)} 65%{transform:translate(-8px,-6px)} }
    @keyframes dD { 0%,100%{transform:translate(0,0)} 30%{transform:translate(-8px,-8px)} 65%{transform:translate(6px,6px)} }

    /* SVG Logo Area */
    #lwrap { position: relative; z-index: 20; width: min(55vw, 420px); will-change: transform; }
    #lsvg { width: 100%; height: auto; overflow: visible; }

    /* Brand Text */
    #brand {
      position: relative; z-index: 20;
      display: flex; flex-direction: column;
      align-items: center; gap: 8px;
      margin-top: 10px;
    }
    .logo-text-container {
      display: flex; align-items: baseline; font-family: 'Outfit', sans-serif;
      font-weight: 700; font-size: clamp(2.5rem, 6vw, 4.2rem);
      letter-spacing: -0.03em; color: var(--text); line-height: 1;
    }
    .t-char {
      opacity: 0; filter: blur(12px); transform: translateX(-15px);
      display: inline-block; will-change: opacity, filter, transform; position: relative;
    }
    
    .idot-wrap { position: relative; }
    .idot {
      position: absolute; top: 0.16em; left: 50%;
      transform: translateX(-50%) scale(0); width: 0.16em; height: 0.16em;
      background: linear-gradient(135deg, var(--grad-1), var(--grad-2));
      border-radius: 50%; opacity: 0;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
    }

    #ltag {
      font: 400 clamp(.85rem, 1.7vw, 1rem) 'Outfit', sans-serif; color: var(--sub);
      display: flex; align-items: center; gap: 8px;
      opacity: 0; filter: blur(10px); transform: translateY(10px);
      will-change: opacity, filter, transform;
    }
    .badge {
      padding: 3px 10px; background: linear-gradient(135deg, rgba(59,130,246,0.1), rgba(34,211,238,0.1));
      color: var(--accent); font: 600 .75rem 'Outfit', monospace;
      border-radius: 999px; border: 1px solid rgba(59,130,246,0.2);
    }
    html.dark .badge { color: #38bdf8; }

    #splash.out { animation: splashOut 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    @keyframes splashOut { to { opacity: 0; filter: blur(15px); transform: scale(1.05); } }

    /* Dashboard Skeleton */
    #dash {
      position: fixed; inset: 0; background: var(--bg); z-index: 50; display: flex;
      opacity: 0; transform: scale(.97); pointer-events: none;
      transition: all 0.6s cubic-bezier(0.2, 0, 0, 1); padding: 24px; gap: 24px;
    }
    #dash.show { opacity: 1; transform: scale(1); pointer-events: all; }

    .skel-sidebar {
      width: 260px; height: 100%; border-radius: 20px;
      background: var(--card-bg); border: 1px solid var(--card-b);
      display: flex; flex-direction: column; padding: 24px; gap: 16px;
    }
    .skel-content { flex: 1; display: flex; flex-direction: column; gap: 24px; }
    .skel-header {
      width: 100%; height: 80px; border-radius: 20px;
      background: var(--card-bg); border: 1px solid var(--card-b);
    }
    .skel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
    .skel-card { height: 180px; border-radius: 20px; background: var(--card-bg); border: 1px solid var(--card-b); }
    .shimmer { position: relative; overflow: hidden; }
    .shimmer::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      transform: translateX(-100%); animation: shimmer 2s infinite ease-in-out;
    }
    html.dark .shimmer::after { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent); }
    @keyframes shimmer { 100% { transform: translateX(100%); } }
    .s-box { background: var(--grid); border-radius: 8px; height: 24px; }
  </style>
</head>

const DRIFT = ['dA','dB','dC','dD'];
let runId = 0;

const brandChars = ['l', {char: 'ı', isI: true}, 'n', 'k', {char: 'ı', isI: true}, 'v', 'o'];
const lnameContainer = document.getElementById('lname');
function setupText() {
  lnameContainer.innerHTML = '';
  brandChars.forEach(item => {
    const span = document.createElement('span');
    span.className = 't-char';
    if(typeof item === 'object') {
      span.classList.add('idot-wrap');
      span.innerHTML = `${item.char}<span class="idot"></span>`;
    } else {
      span.textContent = item;
    }
    lnameContainer.appendChild(span);
  });
}

function getStarPath(size) {
  return `M 0 ${-size} Q ${size*0.2} ${-size*0.2} ${size} 0 Q ${size*0.2} ${size*0.2} 0 ${size} Q ${-size*0.2} ${size*0.2} ${-size} 0 Q ${-size*0.2} ${-size*0.2} 0 ${-size} Z`;
}

function createCreativeSparkles(x, y) {
  const group = document.getElementById('star-sparkles');

  const wave = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  wave.setAttribute("cx", x); wave.setAttribute("cy", y);
  wave.setAttribute("r", 0); wave.setAttribute("fill", "none");
  wave.setAttribute("stroke", "url(#lg)"); wave.setAttribute("stroke-width", "5");
  group.appendChild(wave);
  wave.animate([
    { r: 0, opacity: 1, strokeWidth: 5 },
    { r: 50, opacity: 0, strokeWidth: 0 }
  ], { duration: 500, easing: 'cubic-bezier(0.1, 0.8, 0.2, 1)' }).onfinish = () => wave.remove();

  for(let i = 0; i < 2; i++) {
    const star = document.createElementNS("http://www.w3.org/2000/svg", "path");
    const size = 10 + Math.random() * 8;
    star.setAttribute("d", getStarPath(size));
    star.setAttribute("fill", i%2===0 ? "#22d3ee" : "#3b82f6");
    group.appendChild(star);
    
    const angle = (Math.PI * 2 / 2) * i + Math.random()*0.5;
    const dist = 25 + Math.random() * 20;
    const endX = x + Math.cos(angle) * dist;
    const endY = y + Math.sin(angle) * dist;
    const rot = 45 + Math.random() * 90;

    star.animate([
      { transform: `translate(${x}px, ${y}px) scale(0) rotate(0deg)`, opacity: 1 },
      { transform: `translate(${x + (endX-x)*0.5}px, ${y + (endY-y)*0.5}px) scale(1) rotate(${rot}deg)`, opacity: 1, offset: 0.4 },
      { transform: `translate(${endX}px, ${endY}px) scale(0) rotate(${rot*2}deg)`, opacity: 0 }
    ], { duration: 600 + Math.random()*200, easing: 'ease-out' }).onfinish = () => star.remove();
  }

  for(let i=0; i<4; i++){
    const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    dot.setAttribute("cx", x); dot.setAttribute("cy", y);
    dot.setAttribute("r", 1.5 + Math.random()*2);
    dot.setAttribute("fill", "#22d3ee");
    group.appendChild(dot);
    
    const angle = Math.random() * Math.PI * 2;
    const dist = 30 + Math.random() * 40;
    dot.animate([
      { transform: 'translate(0,0)', opacity: 1 },
      { transform: `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`, opacity: 0 }
    ], { duration: 450, easing: 'cubic-bezier(0,0,0.2,1)' }).onfinish = () => dot.remove();
  }
}

async function run() {
  const id = ++runId;
  const ok = () => id === runId;

  const splash = document.getElementById('splash');
  const dash   = document.getElementById('dash');
  splash.classList.remove('out');
  splash.style.display = 'flex';
  dash.classList.remove('show');
  
  setupText();

  const umask = document.getElementById('u-mask-line');
  const bmask = document.getElementById('bar-mask-line');
  const lrGrp = document.getElementById('left-ring-group');
  const lr = document.getElementById('lr');
  const rr = document.getElementById('rr');
  const bgExpand = document.getElementById('bg-expand');
  const lwrap = document.getElementById('lwrap');
  const ltag = document.getElementById('ltag');
  const la = document.getElementById('la');

  const uLen = umask.getTotalLength();
  const bLen = bmask.getTotalLength();
  
  umask.style.transition = bmask.style.transition = 'none';
  umask.style.strokeDasharray = uLen; umask.style.strokeDashoffset = uLen;
  bmask.style.strokeDasharray = bLen; bmask.style.strokeDashoffset = bLen;
  
  lrGrp.style.transition = lr.style.transition = rr.style.transition = 'none';
  lrGrp.style.transform = 'scale(0)';
  lr.style.strokeDasharray = rr.style.strokeDasharray = 3000; 
  lr.style.strokeDashoffset = rr.style.strokeDashoffset = 3000; 
  lr.style.fillOpacity = rr.style.fillOpacity = 0;

  lwrap.style.transition = ltag.style.transition = 'none';
  lwrap.style.transform = 'translateY(0) scale(1)';
  ltag.style.opacity = '0'; ltag.style.filter = 'blur(10px)'; ltag.style.transform = 'translateY(10px)';
  
  document.getElementById('star-sparkles').innerHTML = '';
  document.querySelectorAll('.ucard-wrapper').forEach(c => c.remove());

  await wait(50); 
  if (!ok()) return;

  const getLRC = () => {
    const rect = document.getElementById('lsvg').getBoundingClientRect();
    return { x: rect.left + ((353-140)/750) * rect.width, y: rect.top  + ((648-286)/600) * rect.height };
  };
  const lrc = getLRC();

  bgExpand.style.transition = 'none';
  bgExpand.style.clipPath = `circle(0px at ${lrc.x}px ${lrc.y}px)`;

  const isMobile = window.innerWidth < 768;
  const numCards = isMobile ? 4 : 6;
  const activeCards = CARDS_DATA.slice(0, numCards);

  const startCoords = [
    { x: 85, y: 15 }, { x: 15, y: 15 }, { x: 80, y: 75 },
    { x: 20, y: 80 }, { x: 50, y: 15 }, { x: 50, y: 85 }
  ];

  const cardElements = activeCards.map((d, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'ucard-wrapper';
    wrap.style.left = lrc.x + 'px'; wrap.style.top = lrc.y + 'px';

    const targetX = (startCoords[i].x / 100) * window.innerWidth - lrc.x;
    const targetY = (startCoords[i].y / 100) * window.innerHeight - lrc.y;

    const pos = document.createElement('div');
    pos.className = 'ucard-pos';
    pos.style.transform = `translate(${targetX}px, ${targetY}px)`;

    const c = document.createElement('div');
    c.className = 'ucard';
    c.innerHTML = `
      <div class="ufav" style="background: ${d.bg}">
        <svg viewBox="0 0 24 24">${d.svg}</svg>
      </div>
      <div class="utext-wrap"><span class="utext">${d.url}</span></div>`;
    
    pos.appendChild(c);
    wrap.appendChild(pos);
    splash.appendChild(wrap);

    const textSpan = c.querySelector('.utext');
    textSpan.style.width = textSpan.offsetWidth + 'px';

    setTimeout(() => {
      if(!ok()) return;
      c.style.transition = 'opacity .4s ease';
      c.style.opacity = '1';
      setTimeout(() => { if(ok()) c.style.animation = `${DRIFT[i%4]} ${3 + i*0.3}s ease-in-out infinite`; }, 400);
    }, 200 + i * 120);

    return { wrap, pos, c };
  });

  await wait(1800);
  if (!ok()) return;

  // 2. Shrink Phase: Explicit Width capture to prevent jumping
  for (let i = 0; i < cardElements.length; i++) {
    if (!ok()) return;
    const { c } = cardElements[i];
    
    // Capture current actual width dynamically before CSS transition
    const startWidth = c.offsetWidth;
    c.style.width = startWidth + 'px';
    
    // Force browser to paint/reflow the exact width so the next change animates smoothly
    void c.offsetWidth;

    // Apply the smooth transition to all changed properties
    c.style.transition = 'width 0.4s cubic-bezier(0.4, 0, 0.2, 1), padding 0.4s cubic-bezier(0.4, 0, 0.2, 1), gap 0.4s cubic-bezier(0.4, 0, 0.2, 1), border-radius 0.4s cubic-bezier(0.4, 0, 0.2, 1), background 0.4s, border-color 0.4s'; 
    c.style.background = 'rgba(59,130,246,.15)';
    c.style.borderColor = '#3b82f6';
    
    // Shrink smoothly down to exactly 36px
    c.style.width = '36px';
    c.style.minWidth = '36px';
    c.style.maxWidth = '36px';
    c.style.height = '36px';
    c.style.padding = '0px';
    c.style.gap = '0px';
    c.style.borderRadius = '50%';
    c.style.justifyContent = 'center';
    
    const fav = c.querySelector('.ufav');
    fav.style.transition = 'border-radius 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
    fav.style.borderRadius = '50%';
    
    // As wrapper width animates to 0, text is pushed/cropped from right side
    const utextWrap = c.querySelector('.utext-wrap');
    utextWrap.style.transition = 'width 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease';
    utextWrap.style.width = '0px';
    utextWrap.style.minWidth = '0px';
    utextWrap.style.opacity = '0';
    utextWrap.style.margin = '0px';
    
    await wait(i < cardElements.length - 1 ? 80 : 0);
  }

  await wait(500); 
  if (!ok()) return;

  // 3. Smooth Gravity Spiral to Center Phase
  for (let i = 0; i < cardElements.length; i++) {
    if (!ok()) return;
    const { wrap, pos, c } = cardElements[i];
    
    c.style.animation = 'none';
    
    const spinDir = i % 2 === 0 ? 720 : -720; 
    wrap.style.transition = 'transform 1.6s cubic-bezier(0.4, 0, 1, 1)'; 
    wrap.style.transform = `rotate(${spinDir}deg)`;

    pos.style.transition = 'transform 1.6s cubic-bezier(0.4, 0, 1, 1), opacity 0.4s 1.2s'; 
    pos.style.transform = `translate(0px, 0px) scale(0)`;
    pos.style.opacity = '0';

    await wait(i < cardElements.length - 1 ? 120 : 0);
  }

  await wait(1100);
  if (!ok()) return;

  // 4. Left Circle Drop / Ripple
  const pulse = document.getElementById('center-pulse');
  pulse.style.opacity = '1';
  pulse.animate([{ r: 0, opacity: 1 }, { r: 180, opacity: 0 }], { duration: 800, easing: 'ease-out' });

  lrGrp.style.transition = 'transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1)';
  lrGrp.style.transform = 'scale(1)';
  
  lr.style.transition = 'stroke-dashoffset 0.6s ease-out';
  lr.style.strokeDashoffset = '0';
  
  await wait(500);
  if (!ok()) return;
  lr.style.transition = 'fill-opacity 0.4s ease';
  lr.style.fillOpacity = '1';

  await wait(200);
  if (!ok()) return;

  // 5. U-Shape Lock (Triggers Particles & BG Reveal sync)
  umask.style.transition = 'stroke-dashoffset 0.7s cubic-bezier(0.5, 0, 0.2, 1.1)';
  umask.style.strokeDashoffset = '0';

  setTimeout(() => {
    if(ok()) {
      la.animate([
        { transform: 'translateY(0)' },
        { transform: 'translateY(4px)' },
        { transform: 'translateY(-2px)' },
        { transform: 'translateY(0)' }
      ], { duration: 350, easing: 'ease-out' });

      createCreativeSparkles(259, 520);
      createCreativeSparkles(447, 520);

      bgExpand.style.clipPath = `circle(150vmax at ${lrc.x}px ${lrc.y}px)`;
    }
  }, 420);

  await wait(700);
  if (!ok()) return;

  // 6. Bar Draw
  bmask.style.transition = 'stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
  bmask.style.strokeDashoffset = '0';
  await wait(400);
  if (!ok()) return;

  // 7. Right Ring
  const rp2 = document.getElementById('rp2');
  rp2.style.opacity = '1';
  rp2.animate([{ r: 0, opacity: 1 }, { r: 150, opacity: 0 }], { duration: 800, easing: 'ease-out' });

  rr.style.transition = 'stroke-dashoffset 0.7s ease-out';
  rr.style.strokeDashoffset = '0';
  await wait(500);
  rr.style.transition = 'fill-opacity 0.4s ease';
  rr.style.fillOpacity = '1';

  await wait(400);
  if (!ok()) return;

  // 8. Logo Up
  lwrap.style.transition = 'transform 0.8s cubic-bezier(0.2, 0, 0, 1)';
  lwrap.style.transform = 'translateY(-30px) scale(0.9)';

  await wait(250);
  if (!ok()) return;

  // 9. Brand Name Typing
  const chars = document.querySelectorAll('.t-char');
  for (let i = 0; i < chars.length; i++) {
    if (!ok()) return;
    const span = chars[i];
    
    span.style.transition = 'opacity 0.3s ease, filter 0.4s ease-out, transform 0.4s cubic-bezier(0.2,0,0,1)';
    span.style.opacity = '1';
    span.style.filter = 'blur(0px)';
    span.style.transform = 'translateX(0)';

    const dot = span.querySelector('.idot');
    if(dot) {
      setTimeout(() => {
        if(ok()) {
          dot.style.opacity = '1';
          dot.style.transform = 'translateX(-50%) scale(1)';
        }
      }, 150);
    }
    await wait(60); 
  }

  ltag.style.transition = 'opacity 0.6s ease, filter 0.6s, transform 0.6s cubic-bezier(0.2,0,0,1)';
  ltag.style.opacity = '1';
  ltag.style.filter = 'blur(0px)';
  ltag.style.transform = 'translateY(0)';

  await wait(2200);
  if (!ok()) return;

  // 10. Dashboard Transition
  splash.classList.add('out');
  await wait(700);
  if (!ok()) return;
  splash.style.display = 'none';
  dash.classList.add('show');
}

// Theme Logic
document.getElementById('btheme').addEventListener('click', () => {
  document.documentElement.classList.toggle('dark');
});

document.getElementById('breplay').addEventListener('click', run);
window.addEventListener('load', () => setTimeout(run, 400));
</script>
